<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Hub Pro - Image to PDF</title>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Prevent text selection for extra protection */
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .drop-zone {
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8fbff;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background-color: #e8f4fd;
            border-color: #2980b9;
        }
        .drop-zone p {
            margin: 10px 0;
            font-size: 16px;
            color: #555;
        }
        .drop-zone .icon {
            font-size: 40px;
            color: #3498db;
        }
        #fileInput { display: none; }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-count {
            font-weight: bold;
            color: #2c3e50;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-convert {
            background-color: #27ae60;
            color: white;
        }
        .btn-convert:hover { background-color: #219653; }
        .btn-convert:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        .btn-clear {
            background-color: #e74c3c;
            color: white;
        }
        .btn-clear:hover { background-color: #c0392b; }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
        }
        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ddd;
            pointer-events: none; /* Prevents right click on images */
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #7f8c8d;
            min-height: 20px;
        }
        .status.success { color: #27ae60; font-weight: bold; }
        .status.error { color: #e74c3c; font-weight: bold; }
        
        /* Footer */
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🖨️ Print Hub Pro</h1>
    <p class="subtitle">Premium Image to PDF Tool | 100% Free & Private | Limit: 100 Images</p>

    <div class="drop-zone" id="dropZone">
        <div class="icon">📁</div>
        <p><strong>Click here</strong> or <strong>Drag & Drop</strong> images</p>
        <p style="font-size: 12px; color: #888;">(JPG, JPEG, PNG only. Max 100 files)</p>
        <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/jpg">
    </div>

    <div class="controls">
        <span class="file-count" id="fileCount">0 / 100 images selected</span>
        <div>
            <button class="btn btn-clear" id="clearBtn" style="display:none;">Clear All</button>
            <button class="btn btn-convert" id="convertBtn" disabled>Convert to PDF</button>
        </div>
    </div>

    <div class="preview-grid" id="previewGrid" style="display:none;"></div>
    
    <div class="status" id="status"></div>
</div>

<div class="footer">© 2024 Print Hub Pro. All Rights Reserved.</div>

<script>
    // ==========================================
    // 🔒 SECURITY & ANTI-INSPECT BLOCKERS
    // ==========================================
    
    // 1. Disable Right-Click (Context Menu)
    document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        return false;
    });

    // 2. Disable Developer Tools Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        // Disable F12
        if (e.key === 'F12') {
            e.preventDefault();
            return false;
        }
        // Disable Ctrl+Shift+I / J / C (Inspect Element)
        if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
            e.preventDefault();
            return false;
        }
        // Disable Ctrl+U (View Source)
        if (e.ctrlKey && e.key.toUpperCase() === 'U') {
            e.preventDefault();
            return false;
        }
        // Disable Ctrl+S (Save Page)
        if (e.ctrlKey && e.key.toUpperCase() === 'S') {
            e.preventDefault();
            return false;
        }
    });

    // 3. Disable text selection and dragging
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());

    // ==========================================
    // 🛠️ APP LOGIC (Image to PDF)
    // ==========================================
    const { jsPDF } = window.jspdf;
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const fileCount = document.getElementById('fileCount');
    const convertBtn = document.getElementById('convertBtn');
    const clearBtn = document.getElementById('clearBtn');
    const status = document.getElementById('status');

    let selectedFiles = [];
    const MAX_LIMIT = 100;

    // UI Events
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFiles);

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles({ target: { files: e.dataTransfer.files } });
    });

    clearBtn.addEventListener('click', () => {
        selectedFiles = [];
        updateUI();
    });

    convertBtn.addEventListener('click', convertToPDF);

    function handleFiles(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const validFiles = files.filter(f => ['image/jpeg', 'image/png', 'image/jpg'].includes(f.type));
        
        if (validFiles.length < files.length) {
            showStatus('Some files were skipped (Only JPG/PNG allowed).', 'error');
        }

        if (selectedFiles.length + validFiles.length > MAX_LIMIT) {
            showStatus(`❌ Limit exceeded! Max ${MAX_LIMIT} images allowed in Print Hub Pro.`, 'error');
            const allowed = MAX_LIMIT - selectedFiles.length;
            if (allowed > 0) {
                selectedFiles.push(...validFiles.slice(0, allowed));
            }
        } else {
            selectedFiles.push(...validFiles);
        }

        updateUI();
        fileInput.value = ''; 
    }

    function updateUI() {
        fileCount.textContent = `${selectedFiles.length} / ${MAX_LIMIT} images selected`;
        convertBtn.disabled = selectedFiles.length === 0;
        clearBtn.style.display = selectedFiles.length > 0 ? 'inline-block' : 'none';
        
        previewGrid.innerHTML = '';
        if (selectedFiles.length > 0) {
            previewGrid.style.display = 'grid';
            selectedFiles.forEach(file => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                div.appendChild(img);
                previewGrid.appendChild(div);
            });
        } else {
            previewGrid.style.display = 'none';
        }
        
        if(selectedFiles.length > 0) showStatus('', '');
    }

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = 'status ' + type;
    }

    async function convertToPDF() {
        if (selectedFiles.length === 0) return;
        
        convertBtn.disabled = true;
        showStatus('Processing images... Please wait.', '');
        
        const pdf = new jsPDF();
        const pageWidth = 210; 
        const pageHeight = 297; 
        const margin = 10;
        const maxWidth = pageWidth - (margin * 2);
        const maxHeight = pageHeight - (margin * 2);

        const objectUrls = [];

        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                showStatus(`Processing image ${i + 1} of ${selectedFiles.length}...`, '');
                
                const file = selectedFiles[i];
                const imgUrl = URL.createObjectURL(file);
                objectUrls.push(imgUrl);

                const img = await loadImage(imgUrl);
                
                let imgWidth = img.width;
                let imgHeight = img.height;
                const ratio = Math.min(maxWidth / imgWidth, maxHeight / imgHeight);
                
                imgWidth *= ratio;
                imgHeight *= ratio;

                const x = margin + (maxWidth - imgWidth) / 2;
                const y = margin + (maxHeight - imgHeight) / 2;

                const format = file.type === 'image/png' ? 'PNG' : 'JPEG';

                if (i > 0) pdf.addPage();
                pdf.addImage(imgUrl, format, x, y, imgWidth, imgHeight);
            }

            showStatus('✅ Success! Downloading PDF...', 'success');
            pdf.save('PrintHubPro_Converted.pdf');
            
            objectUrls.forEach(url => URL.revokeObjectURL(url));
            
        } catch (error) {
            console.error(error);
            showStatus('❌ Error creating PDF. Please try again.', 'error');
        } finally {
            convertBtn.disabled = false;
        }
    }

    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = src;
        });
    }
</script>

</body>
</html>
